# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - T-node-web-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: myacrdockerregistry123.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_337B89BD7C9C4548993C731A8762A580 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_6753C40D816444C4BEF77E74C1925246 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: myacrdockerregistry123.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_337B89BD7C9C4548993C731A8762A580 }}/my-nodejs-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'T-node-web-app'
          slot-name: 'Production'
          images: 'myacrdockerregistry123.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_337B89BD7C9C4548993C731A8762A580 }}/my-nodejs-app:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B2376A8437724DCB959AA1F0BC7429BB }}